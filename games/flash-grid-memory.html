<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Grid Memory</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f2f5ff}main{max-width:680px;margin:auto;padding:20px}a{color:#9bc8ff}h1{margin-bottom:4px}p{color:#b8c4d9}section{background:#151d30;border:1px solid #29344e;border-radius:18px;padding:16px;margin:16px 0}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}label{display:grid;gap:5px;font-size:14px}select,button{background:#27354f;border:1px solid #50617d;color:white;border-radius:10px;padding:12px;font-size:16px}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}.primary{background:#2563eb;border-color:#528bff}.grid{display:grid;gap:7px;width:min(100%,480px);aspect-ratio:1;margin:16px auto}.cell{border:1px solid #465673;border-radius:9px;background:#27354f;padding:0;min-width:0;transition:background .12s}.cell.target{background:#36a9ff;box-shadow:0 0 12px #1d9bff80}.cell.chosen{background:#f59e0b}.cell.hit{background:#22c55e}.cell.missed{background:#ef4444}.cell.extra{background:#f59e0b}.status{text-align:center;font-weight:700;font-size:20px;min-height:28px}.sub{text-align:center;color:#a8b8d3}footer{color:#9daecb;font-size:13px;margin-top:20px}</style></head><body><main><a href="../index.html">← Back to Focus Games</a><h1>Flash Grid Memory</h1><p>Memorize the blue cells, then tap their positions from memory.</p><section><div class="controls"><label>Difficulty<select id="difficulty"><option value="practice">Practice</option><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option><option value="expert">Expert</option></select></label><button id="start" class="primary">Start / New Round</button><button id="submit" disabled>Submit Answer</button><button id="clear" disabled>Clear Selection</button><button id="show" disabled>Show Pattern</button></div><p id="settings"></p><div class="status" id="status" aria-live="polite">Choose a level and press Start</div><div class="sub" id="sub">Practice has no memorization time limit.</div><div class="grid" id="grid" aria-label="Memory grid"></div><div id="results" aria-live="polite"></div></section><footer>Runs entirely in your browser. No accounts or data collection.</footer></main><script>(()=>{'use strict';const configs={practice:{n:5,k:5,ms:0},easy:{n:4,k:3,ms:4000},normal:{n:5,k:5,ms:3000},hard:{n:5,k:7,ms:2000},expert:{n:6,k:9,ms:1500}};const $=id=>document.getElementById(id),grid=$('grid'),difficulty=$('difficulty'),start=$('start'),submit=$('submit'),clear=$('clear'),show=$('show'),status=$('status'),sub=$('sub'),results=$('results');let config,targets=new Set(),selected=new Set(),phase='idle',timer=null,deadline=0,remaining=0,perfect=0,rounds=0,assisted=false;function cancel(){if(timer!==null)clearTimeout(timer);timer=null}function settings(){const c=configs[difficulty.value];$('settings').textContent=`${c.n}×${c.n} grid · ${c.k} cells · ${c.ms?c.ms/1000+' second preview':'untimed preview'}`}function render(){grid.style.gridTemplateColumns=`repeat(${config.n},1fr)`;grid.replaceChildren();for(let i=0;i<config.n**2;i++){const b=document.createElement('button');b.type='button';b.className='cell';b.setAttribute('aria-label',`Row ${Math.floor(i/config.n)+1}, column ${i%config.n+1}`);if(phase==='preview'&&targets.has(i))b.classList.add('target');if(phase==='recall'&&selected.has(i))b.classList.add('chosen');if(phase==='review'){if(targets.has(i)&&selected.has(i))b.classList.add('hit');else if(targets.has(i))b.classList.add('missed');else if(selected.has(i))b.classList.add('extra')}b.disabled=phase!=='recall';b.addEventListener('click',()=>{if(phase!=='recall')return;if(selected.has(i))selected.delete(i);else selected.add(i);status.textContent=`Selected ${selected.size} of ${config.k}`;render()});grid.appendChild(b)}}function controls(){submit.disabled=phase!=='recall';clear.disabled=phase!=='recall';show.disabled=phase!=='preview'&&phase!=='recall';show.textContent=phase==='preview'&&config.ms===0?'Begin Recall':'Show Pattern';difficulty.disabled=phase==='preview'||phase==='recall'}function recall(){cancel();phase='recall';status.textContent=`Select the ${config.k} remembered cells`;sub.textContent='Tap cells, then Submit Answer.';controls();render()}function newRound(){cancel();config={...configs[difficulty.value]};targets=new Set();selected=new Set();assisted=false;results.textContent='';const indices=Array.from({length:config.n**2},(_,i)=>i);for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}indices.slice(0,config.k).forEach(i=>targets.add(i));phase='preview';status.textContent='Memorize the blue cells';sub.textContent=config.ms?'The pattern will disappear automatically.':'Take your time, then press Begin Recall.';controls();render();if(config.ms){timer=setTimeout(recall,config.ms)}}function submitAnswer(){if(phase!=='recall')return;phase='review';const hits=[...selected].filter(x=>targets.has(x)).length,missed=config.k-hits,extra=selected.size-hits;const perfectRound=missed===0&&extra===0;rounds++;if(perfectRound&&!assisted)perfect++;status.textContent=perfectRound?'Perfect pattern!':'Pattern revealed';sub.textContent='Green = correct · Red = missed · Orange = extra';results.textContent=`Correct: ${hits}/${config.k} · Missed: ${missed} · Extra: ${extra} · Precision: ${selected.size?Math.round(hits/selected.size*100):0}% · Perfect unassisted rounds: ${perfect}/${rounds}${assisted?' · Assisted round':''}`;controls();render()}function showPattern(){if(phase==='preview'&&!config.ms){recall();return}if(phase==='recall'){assisted=true;phase='review';status.textContent='Pattern revealed (practice)';sub.textContent='Green = correct · Red = missed · Orange = extra';results.textContent='This round was assisted and is not scored. Start a new round to try again.';controls();render()}}start.addEventListener('click',newRound);submit.addEventListener('click',submitAnswer);clear.addEventListener('click',()=>{selected.clear();status.textContent=`Selected 0 of ${config.k}`;render()});show.addEventListener('click',showPattern);difficulty.addEventListener('change',settings);config=configs.normal;settings();render();})();</script></body></html>
