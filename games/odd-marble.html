<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Odd Marble · Focus Games</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101522;color:#f1f5ff}header{padding:18px 20px;border-bottom:1px solid #30394d;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}main{max-width:850px;margin:auto;padding:22px 16px}.muted{color:#aeb9cf}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:24px}.card{background:#1c2639;border:1px solid #34435e;border-radius:16px;padding:22px;text-align:left}.card h2{margin:6px 0 10px;font-size:20px}.card p{color:#b7c3d9;line-height:1.5}button,select{font:inherit;border-radius:10px;border:1px solid #506180;background:#263550;color:#fff;padding:11px 14px;cursor:pointer;touch-action:manipulation}button.primary{background:#4679e8;border-color:#4679e8;font-weight:650}button:disabled{opacity:.5;cursor:default}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:end;margin:14px 0}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#c6d0e2}.field select{min-width:105px}.game{display:none}.board-wrap{width:min(100%,620px);margin:16px auto;position:relative}canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#000;border:2px solid #41506b;border-radius:50%;touch-action:manipulation}.status{text-align:center;min-height:48px;color:#d4dff3;line-height:1.5}.hint{font-size:13px;color:#9caec8;text-align:center}#back{display:none}footer{text-align:center;padding:22px;color:#8090a9;font-size:12px}@media(max-width:480px){main{padding:16px 12px}.toolbar{gap:7px}button,select{padding:10px 11px}header{padding:14px}}
a{color:#a9c8ff}.back{display:inline-block;text-decoration:none;padding:10px 14px;border:1px solid #506180;border-radius:10px} .card a{display:inline-block;text-decoration:none;padding:11px 16px;border-radius:10px;background:#4679e8;color:white;font-weight:650} .card .disabled{background:#263550;color:#aeb9cf} </style></head><body><header><h1>🎯 Focus Games</h1><a class="back" href="../index.html">← All Games</a></header><main><h2>Find the Odd Marble</h2><p class="muted">Every marble moves around its own small fixed circle. Tap the one rotating counterclockwise.</p><div class="toolbar"><label class="field">Marbles<select id="count"><option>50</option><option>60</option><option>70</option></select></label><label class="field">Speed<select id="speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></label><button id="start" class="primary" type="button">Start / New Round</button><button id="pause" type="button">Pause</button><button id="show" type="button">Show odd marble</button></div><div class="board-wrap"><canvas id="board" width="800" height="800" aria-label="Rotating marbles game"></canvas></div><div class="status" id="status" aria-live="polite">Press Start to begin.</div><p class="hint">Use Show to highlight the reverse-moving marble in orange, then Hide to try again.</p></main><footer>Focus Games</footer><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const canvas=$('board'),ctx=canvas.getContext('2d');let balls=[],oddIndex=-1,running=false,paused=false,reveal=false,last=0,raf=0;const TAU=Math.PI*2,C=400,R=390;const speeds={slow:1.9,normal:3.1,fast:4.5};function init(){const n=Number($('count').value);balls=[];const grid=Math.ceil(Math.sqrt(n));const spacing=740/grid;const centers=[];for(let row=0;row<grid;row++)for(let col=0;col<grid;col++){let x=40+(col+.5)*spacing,y=40+(row+.5)*spacing;if(Math.hypot(x-C,y-C)<R-30)centers.push({x,y})}for(let i=centers.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[centers[i],centers[j]]=[centers[j],centers[i]]}if(centers.length<n){let attempts=0;while(centers.length<n&&attempts++<10000){const a=Math.random()*TAU,rr=Math.sqrt(Math.random())*(R-42),x=C+Math.cos(a)*rr,y=C+Math.sin(a)*rr;if(centers.every(p=>Math.hypot(p.x-x,p.y-y)>24))centers.push({x,y})}}const orbit=Math.max(8,Math.min(14,spacing*.23));for(let i=0;i<n;i++){const p=centers[i];balls.push({cx:p.x,cy:p.y,orbit,angle:Math.random()*TAU,dir:1})}oddIndex=Math.floor(Math.random()*balls.length);balls[oddIndex].dir=-1;reveal=false;$('show').textContent='Show odd marble';paused=false;$('pause').textContent='Pause';running=true;last=0;$('status').textContent='Find and tap the counterclockwise marble.';cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}function draw(){ctx.clearRect(0,0,800,800);ctx.fillStyle='#000';ctx.beginPath();ctx.arc(C,C,R,0,TAU);ctx.fill();balls.forEach((b,i)=>{const x=b.cx+Math.cos(b.angle)*b.orbit,y=b.cy+Math.sin(b.angle)*b.orbit;ctx.beginPath();ctx.arc(x,y,5.5,0,TAU);ctx.fillStyle=reveal&&i===oddIndex?'#ff9d30':'#f6f8ff';ctx.fill();ctx.beginPath();ctx.arc(x-1.7,y-1.8,1.7,0,TAU);ctx.fillStyle=reveal&&i===oddIndex?'#ffe2a9':'#fff';ctx.fill()})}function frame(ts){if(!running)return;if(last&&!paused){const dt=Math.min((ts-last)/1000,.05),speed=speeds[$('speed').value];balls.forEach(b=>b.angle=(b.angle+b.dir*speed*dt)%TAU)}last=ts;draw();raf=requestAnimationFrame(frame)}$('start').addEventListener('click',init);$('pause').addEventListener('click',()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'Resume':'Pause';$('status').textContent=paused?'Paused.':'Find and tap the counterclockwise marble.'});$('show').addEventListener('click',()=>{if(!balls.length){$('status').textContent='Press Start first.';return}reveal=!reveal;$('show').textContent=reveal?'Hide odd marble':'Show odd marble';draw()});$('count').addEventListener('change',()=>{if(running)init()});canvas.addEventListener('click',e=>{if(!running||paused)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*800/rect.width,y=(e.clientY-rect.top)*800/rect.height;let closest=-1,d=Infinity;balls.forEach((b,i)=>{const bx=b.cx+Math.cos(b.angle)*b.orbit,by=b.cy+Math.sin(b.angle)*b.orbit;const dist=Math.hypot(x-bx,y-by);if(dist<d){d=dist;closest=i}});const touchRadius=Math.max(17,800/rect.width*12);if(d>touchRadius)return;if(closest===oddIndex){$('status').textContent='✅ Correct! You found the reverse-moving marble.';reveal=true;$('show').textContent='Hide odd marble';draw()}else{$('status').textContent='Not that one — keep looking!'}});draw()})();
</script></body></html>
