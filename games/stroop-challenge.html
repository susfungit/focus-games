<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stroop Color Challenge</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7ff;min-height:100dvh}main{max-width:750px;margin:auto;padding:22px 16px 45px}a{color:#a9c9ff}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:24px 0 8px}p{color:#b6bfd4;line-height:1.5}.panel{background:#151e32;border:1px solid #303e57;border-radius:18px;padding:16px;margin-top:16px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:.85rem;color:#c7d0e4}select,button{font:inherit;border-radius:11px;padding:13px;min-height:48px}select{background:#0c1528;color:white;border:1px solid #45546e;width:100%}button{background:#344461;border:1px solid #52617a;color:white;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}button.primary{background:#4c74df;border-color:#7095ff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat{background:#0c1528;padding:10px 4px;border-radius:10px}.stat strong{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}.stat small{color:#b6bfd4}.stage{min-height:210px;background:#060a12;border-radius:16px;margin:14px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}.word{font-size:clamp(2.8rem,12vw,5.6rem);font-weight:850;letter-spacing:.03em;line-height:1.1}.hint{color:#c3cbda;font-size:.92rem}.feedback{height:22px;font-weight:700}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.answers button{font-weight:700}.results{line-height:1.9} .hidden{display:none!important}@media(max-width:400px){.answers{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{gap:4px}.stat strong{font-size:1rem}}</style></head><body><main><header><a href="../index.html">← All focus games</a><span>Game 4</span></header><h1>Stroop Color Challenge</h1><p>Tap the <strong>ink color</strong> of the word, not the color it spells. Each answer advances automatically—no Next button.</p><section class="panel"><div class="controls"><div class="field"><label for="level">Difficulty</label><select id="level"><option value="practice">Practice · untimed</option><option value="easy">Easy · 60 seconds</option><option value="normal" selected>Normal · 45 seconds</option><option value="hard">Hard · 30 seconds</option><option value="expert">Expert · 30 seconds</option></select></div><div class="field"><label for="sound">Sound</label><select id="sound"><option value="off" selected>Off</option><option value="on">On</option></select></div></div><div class="actions"><button class="primary" id="start">Start / New Round</button><button id="pause" disabled>Pause</button></div></section><section class="panel"><div class="stats"><div class="stat"><strong id="time">45</strong><small>Time left</small></div><div class="stat"><strong id="score">0</strong><small>Correct</small></div><div class="stat"><strong id="errors">0</strong><small>Incorrect</small></div></div><div class="stage" aria-live="polite"><div class="hint" id="instruction">Press Start to begin</div><div class="word" id="word">READY</div><div class="feedback" id="feedback"></div></div><div class="answers" id="answers"></div></section><section class="panel hidden" id="results" aria-live="polite"><h2>Round results</h2><div class="results" id="resultText"></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const palette=[{name:'Red',hex:'#ff5a65'},{name:'Blue',hex:'#5b9dff'},{name:'Green',hex:'#42d88b'},{name:'Yellow',hex:'#ffe15a'},{name:'Purple',hex:'#c58aff'},{name:'Orange',hex:'#ffad53'}];const config={practice:{count:5,duration:Infinity,conflict:.65},easy:{count:3,duration:60,conflict:.45},normal:{count:5,duration:45,conflict:.7},hard:{count:5,duration:30,conflict:.9},expert:{count:6,duration:30,conflict:1}};let state='idle',cfg=config.normal,targets=[],current=null,lastWord=-1,correct=0,wrong=0,streak=0,bestStreak=0,latencies=[],remaining=45,deadline=0,answerStart=0,frame=0,transition=0,pausedTransition=0,transitionDeadline=0,audio=null;function setText(id,v){$(id).textContent=v}function update(){setText('time',Number.isFinite(remaining)?Math.ceil(remaining)+'s':'∞');setText('score',correct);setText('errors',wrong)}function buttonsEnabled(v){$('answers').querySelectorAll('button').forEach(b=>b.disabled=!v)}function sound(ok){if($('sound').value!=='on')return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();let osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=ok?620:220;gain.gain.value=.035;osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.075)}catch(e){}}function next(){if(state!=='running')return;let word;do{word=Math.floor(Math.random()*cfg.count)}while(word===lastWord&&cfg.count>1);lastWord=word;let ink=Math.random()<cfg.conflict?(word+1+Math.floor(Math.random()*(cfg.count-1)))%cfg.count:word;current={word,ink};$('word').textContent=targets[word].name.toUpperCase();$('word').style.color=targets[ink].hex;setText('instruction','Which color are the letters?');setText('feedback','');answerStart=performance.now();buttonsEnabled(true)}function choose(i){if(state!=='running'||!current||transition)return;const ok=i===current.ink;latencies.push(performance.now()-answerStart);if(ok){correct++;streak++;bestStreak=Math.max(bestStreak,streak)}else{wrong++;streak=0}update();sound(ok);setText('feedback',ok?'✓ Correct':'✕ '+targets[current.ink].name);$('feedback').style.color=ok?'#65e9a2':'#ff7e87';buttonsEnabled(false);transitionDeadline=performance.now()+300;transition=setTimeout(()=>{transition=0;transitionDeadline=0;next()},300)}function renderAnswers(){const a=$('answers');a.replaceChildren();targets.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c.name;b.addEventListener('click',()=>choose(i));a.append(b)})}function tick(){if(state!=='running')return;if(Number.isFinite(cfg.duration)){remaining=Math.max(0,(deadline-performance.now())/1000);update();if(remaining<=0){finish();return}}frame=requestAnimationFrame(tick)}function finish(){if(state==='idle'||state==='finished')return;state='finished';cancelAnimationFrame(frame);clearTimeout(transition);transition=0;buttonsEnabled(false);$('pause').disabled=true;setText('instruction','Time is up!');setText('word','DONE');$('word').style.color='#f5f7ff';setText('feedback','');let total=correct+wrong,accuracy=total?Math.round(correct/total*100):0,avg=latencies.length?Math.round(latencies.reduce((a,b)=>a+b,0)/latencies.length):0;let key='stroop-best-'+$('level').value;try{let best=Number(localStorage.getItem(key)||0);if(correct>best&&Number.isFinite(cfg.duration))localStorage.setItem(key,String(correct))}catch(e){}$('resultText').textContent=`Correct: ${correct} · Incorrect: ${wrong} · Accuracy: ${accuracy}% · Average response: ${avg} ms · Longest streak: ${bestStreak}`;$('results').classList.remove('hidden');$('pause').textContent='Pause'}function start(){clearTimeout(transition);transition=0;cancelAnimationFrame(frame);cfg=config[$('level').value];targets=palette.slice(0,cfg.count);correct=wrong=streak=bestStreak=0;latencies=[];lastWord=-1;remaining=cfg.duration;state='running';$('results').classList.add('hidden');$('pause').disabled=false;$('pause').textContent='Pause';renderAnswers();update();deadline=performance.now()+cfg.duration*1000;next();tick()}function pause(){if(state==='running'){state='paused';cancelAnimationFrame(frame);if(Number.isFinite(cfg.duration))remaining=Math.max(0,(deadline-performance.now())/1000);if(transition){pausedTransition=Math.max(0,transitionDeadline-performance.now());clearTimeout(transition);transition=0}else pausedTransition=0;buttonsEnabled(false);setText('instruction','Paused');setText('word','•••');$('word').style.color='#f5f7ff';setText('feedback','');$('pause').textContent='Resume'}else if(state==='paused'){state='running';deadline=performance.now()+remaining*1000;$('pause').textContent='Pause';if(pausedTransition>0){setText('instruction','Resuming…');transitionDeadline=performance.now()+pausedTransition;transition=setTimeout(()=>{transition=0;next()},pausedTransition);pausedTransition=0}else if(current){$('word').textContent=targets[current.word].name.toUpperCase();$('word').style.color=targets[current.ink].hex;setText('instruction','Which color are the letters?');answerStart=performance.now();buttonsEnabled(true)}tick()}}$('start').addEventListener('click',start);$('pause').addEventListener('click',pause);$('level').addEventListener('change',()=>{if(state==='idle'||state==='finished'){remaining=config[$('level').value].duration;update()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause()});update();})();
</script></body></html>
